<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">وقت النشاط والوقت المنقضي</title><desc id="desc">مثال توضيحي لست دقائق: دقيقتان نشطتان ثم ثلاث دقائق تبويب مخفي أو خمول ثم دقيقة نشطة. المنقضي ست دقائق والنشاط ثلاث.</desc><rect width="960" height="300" rx="20" fill="#f3f6ef"/><g font-family="Segoe UI,Tahoma,Arial" text-anchor="middle"><text x="480" y="42" font-size="24" fill="#163b40">مؤقت التبويب · نشاط فعلي داخل الموقع</text><text x="480" y="76" font-size="13" fill="#73856b">رسم توضيحي للحساب، وليس سجل استخدام حقيقي</text><rect x="90" y="111" width="780" height="60" rx="12" fill="#dee7d7"/><rect x="90" y="111" width="260" height="60" rx="12" fill="#2b786b"/><rect x="740" y="111" width="130" height="60" rx="12" fill="#2b786b"/><text x="220" y="147" font-size="17" fill="white">نشاط: دقيقتان</text><text x="545" y="147" font-size="16" fill="#72856b">تبويب مخفي أو خمول: ٣ دقائق</text><text x="805" y="147" font-size="14" fill="white">نشاط: دقيقة</text><text x="90" y="194" font-size="12" fill="#72856b">00:00</text><text x="350" y="194" font-size="12" fill="#72856b">02:00</text><text x="740" y="194" font-size="12" fill="#72856b">05:00</text><text x="870" y="194" font-size="12" fill="#72856b">06:00</text><rect x="160" y="218" width="290" height="47" rx="9" fill="white" stroke="#d6dfce"/><rect x="510" y="218" width="290" height="47" rx="9" fill="white" stroke="#d6dfce"/><text x="305" y="248" font-size="16" fill="#163b40">الوقت المنقضي: ٦ دقائق</text><text x="655" y="248" font-size="16" fill="#287569">وقت التفاعل: ٣ دقائق</text></g></svg>
