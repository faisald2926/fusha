<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">مسار مقارنة التأخير</title><desc id="desc">يفحص المحرك الخطة الحالية أولًا، ثم يحدد إن كان التعذر سابقًا أو إن كانت الخطة تبقى ممكنة بعد التأخير أو تفقد الإمكان.</desc><rect width="960" height="330" rx="20" fill="#f3f6ef"/><g font-family="Segoe UI,Tahoma,Arial" text-anchor="middle"><text x="480" y="42" font-size="24" fill="#163b40">هل غيّر التأخير قابلية تنفيذ الخطة؟</text><rect x="340" y="70" width="280" height="58" rx="12" fill="#163b40"/><text x="480" y="106" font-size="17" fill="white">حل القيود عند البداية الحالية</text><path d="M480 128v30M160 158h640M160 158v29M480 158v29M800 158v29" stroke="#8ea683" stroke-width="2" fill="none"/><rect x="45" y="187" width="230" height="96" rx="12" fill="#fff0dd" stroke="#ead9be"/><rect x="365" y="187" width="230" height="96" rx="12" fill="#e5efd9" stroke="#d5e0c7"/><rect x="685" y="187" width="230" height="96" rx="12" fill="#fff0dd" stroke="#ead9be"/><text x="160" y="219" font-size="16" fill="#9b652e">متعذرة أصلًا</text><text x="160" y="249" font-size="12" fill="#9b652e">لا تنسب التعذر للتأخير</text><text x="480" y="219" font-size="16" fill="#287569">ممكنة الآن وبعد التأخير</text><text x="480" y="249" font-size="12" fill="#287569">اعرض شاهدين وهوامشهما</text><text x="800" y="219" font-size="16" fill="#9b652e">ممكنة الآن ومتعذرة بعده</text><text x="800" y="249" font-size="12" fill="#9b652e">اعرض خيارات تأجيل التزامات</text><text x="480" y="313" font-size="12" fill="#73856b">المقارنة مشروطة بمدد ونوافذ مدخلة؛ لا تثبت الإنجاز الحقيقي</text></g></svg>
